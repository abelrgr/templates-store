<!-- Header -->
<header
  class="fixed w-full top-0 z-50 transition-all duration-300 bg-white/80 dark:bg-slate-900/80 backdrop-blur-md border-b border-gray-100 dark:border-gray-800"
  :class="{ 'header-compact': headerCompact }"
>
  <div class="container mx-auto px-4 py-4 flex justify-between items-center transition-all duration-300">
    <div class="flex items-center gap-2">
      <div
        class="w-8 h-8 rounded-lg bg-gradient-to-br from-indigo-500 to-purple-600 flex items-center justify-center text-white shadow-lg shadow-indigo-500/30 transition-all duration-300 header-icon"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          class="w-5 h-5"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
          stroke-width="2"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M4 5a1 1 0 011-1h14a1 1 0 011 1v2a1 1 0 01-1 1H5a1 1 0 01-1-1V5zM4 13a1 1 0 011-1h6a1 1 0 011 1v6a1 1 0 01-1 1H5a1 1 0 01-1-1v-6zM16 13a1 1 0 011-1h2a1 1 0 011 1v6a1 1 0 01-1 1h-2a1 1 0 01-1-1v-6z"
          />
        </svg>
      </div>
      <h1
        class="text-xl font-bold tracking-tight bg-clip-text text-transparent bg-gradient-to-r from-indigo-600 to-purple-600 dark:from-indigo-400 dark:to-purple-400 transition-all duration-300 header-logo"
      >
        Template Gallery
      </h1>
    </div>

    <!-- Header Search Bar -->
    <div
      class="flex-1 max-w-md mx-4"
      @click.outside="showSuggestions = false; searchHistoryOpen = false"
      x-data="{ searchHistoryOpen: false }"
    >
      <div class="relative">
        <input
          type="text"
          x-model="search"
          @focus="searchHistoryOpen = true"
          @input="searchHistoryOpen = false"
          @keydown.escape="showSuggestions = false; searchHistoryOpen = false"
          @keydown.enter="saveSearch(); showSuggestions = false; searchHistoryOpen = false"
          :placeholder="searchScopeLabel ? 'Search in ' + searchScopeLabel.label + '...' : 'Search templates...'"
          class="w-full pl-10 pr-20 py-2 rounded-xl bg-gray-100 dark:bg-slate-800 border-none focus:ring-2 focus:ring-indigo-500 text-slate-900 dark:text-white placeholder-slate-400 text-sm transition-all"
        />
        <svg
          xmlns="http://www.w3.org/2000/svg"
          class="h-5 w-5 absolute left-3 top-2.5 text-indigo-500"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"
          />
        </svg>
        <div class="absolute right-2 top-1/2 -translate-y-1/2 flex items-center gap-1">
          <!-- Clear -->
          <button
            x-show="search.length > 0"
            @click="search = ''; showSuggestions = false; searchHistoryOpen = false"
            class="p-1 rounded text-slate-400 hover:text-indigo-500 hover:bg-slate-200 dark:hover:bg-slate-700 transition-all cursor-pointer"
            title="Clear search"
          >
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
            </svg>
          </button>
        </div>

        <!-- Suggestions Dropdown -->
        <div
          x-show="showSuggestions && searchSuggestions.length > 0"
          x-transition:enter="transition ease-out duration-200"
          x-transition:enter-start="opacity-0 -translate-y-2"
          x-transition:enter-end="opacity-100 translate-y-0"
          class="absolute top-full left-0 right-0 mt-1 bg-white dark:bg-slate-800 rounded-xl shadow-2xl border border-slate-200 dark:border-slate-700 overflow-hidden z-[60] text-left"
        >
          <div class="p-1.5">
            <template x-for="(s, si) in searchSuggestions" :key="si">
              <button
                @click="selectSearchSuggestion(s.text, s.type)"
                class="w-full flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-slate-50 dark:hover:bg-slate-700/50 transition-colors text-left cursor-pointer"
              >
                <template x-if="s.type === 'template'">
                  <svg class="w-3.5 h-3.5 text-indigo-500 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19.5 14.25v-2.625a3.375 3.375 0 00-3.375-3.375h-1.5A1.125 1.125 0 0113.5 7.125v-1.5a3.375 3.375 0 00-3.375-3.375H8.25m0 12.75h7.5m-7.5 3H12M10.5 2.25H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 00-9-9z" />
                  </svg>
                </template>
                <template x-if="s.type === 'tag'">
                  <svg class="w-3.5 h-3.5 text-amber-500 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.568 3H5.25A2.25 2.25 0 003 5.25v4.318c0 .597.237 1.17.659 1.591l9.581 9.581c.699.699 1.78.872 2.607.33a18.095 18.095 0 005.223-5.223c.542-.827.369-1.908-.33-2.607L11.16 3.66A2.25 2.25 0 009.568 3z" />
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 6h.008v.008H6V6z" />
                  </svg>
                </template>
                <span class="text-xs font-medium text-slate-700 dark:text-slate-200" x-text="s.text"></span>
                <span class="ml-auto text-[9px] uppercase tracking-wider text-slate-400" x-text="s.type"></span>
              </button>
            </template>
          </div>
        </div>

        <!-- Search History -->
        <div
          x-show="searchHistoryOpen && !search && searchHistory.length > 0"
          x-transition:enter="transition ease-out duration-200"
          x-transition:enter-start="opacity-0 -translate-y-2"
          x-transition:enter-end="opacity-100 translate-y-0"
          class="absolute top-full left-0 right-0 mt-1 bg-white dark:bg-slate-800 rounded-xl shadow-2xl border border-slate-200 dark:border-slate-700 overflow-hidden z-[60] text-left"
        >
          <div class="p-1.5">
            <div class="flex items-center justify-between px-3 py-2">
              <span class="text-[9px] font-bold uppercase tracking-widest text-slate-400">Recent Searches</span>
              <button
                @click="clearSearchHistory"
                class="text-[9px] font-semibold text-indigo-500 hover:text-indigo-700 dark:hover:text-indigo-400 transition-colors cursor-pointer"
              >
                Clear all
              </button>
            </div>
            <template x-for="(h, hi) in searchHistory" :key="hi">
              <button
                @click="selectSearchSuggestion(h)"
                class="w-full flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-slate-50 dark:hover:bg-slate-700/50 transition-colors text-left cursor-pointer"
              >
                <svg class="w-3.5 h-3.5 text-slate-400 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
                <span class="text-xs text-slate-600 dark:text-slate-300" x-text="h"></span>
              </button>
            </template>
          </div>
        </div>
      </div>
    </div>

    <div class="flex items-center space-x-4">
      <button
        @click="toggleDarkMode()"
        class="p-2 rounded-full hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors text-gray-600 dark:text-gray-300 cursor-pointer"
        title="Toggle Dark Mode"
      >
        <template x-if="!darkMode">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="h-6 w-6"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"
            />
          </svg>
        </template>
        <template x-if="darkMode">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="h-6 w-6"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M12 3v1m0 18v1m9-9h1M4 12H3m15.364 6.364l.707.707M6.343 6.343l.707.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"
            />
          </svg>
        </template>
      </button>
    </div>
  </div>
</header>
